<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Math Quest</title>
<meta name="description" content="A fun math practice game for kids: adding, taking away, times tables and more.">
<meta name="theme-color" content="#6c4cf5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math Quest">
<style>
  :root{
    --bg1:#6c4cf5; --bg2:#9b5cff;
    --ink:#2b2350; --card:#ffffff;
    --yellow:#ffd23f; --green:#2ec27e; --red:#ff5c6c; --blue:#3fa7ff; --orange:#ff9f1c; --pink:#ff6fb5; --teal:#1fc8b5;
    --radius:clamp(16px,3vmin,28px);
    --gap:clamp(10px,2.2vmin,22px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;}
  body{
    font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    color:var(--ink);
    background:radial-gradient(circle at 20% 10%,#8f74ff 0,transparent 40%),
               radial-gradient(circle at 90% 90%,#ff8fd0 0,transparent 35%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
  .app{
    min-height:100%;
    min-height:100dvh;
    padding:calc(env(safe-area-inset-top) + var(--gap)) calc(env(safe-area-inset-right) + var(--gap))
            calc(env(safe-area-inset-bottom) + var(--gap)) calc(env(safe-area-inset-left) + var(--gap));
    display:flex;flex-direction:column;align-items:center;
  }
  .screen{width:100%;max-width:1000px;flex:1;display:none;flex-direction:column;gap:var(--gap)}
  .screen.active{display:flex;animation:pop .35s ease}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pill{
    background:rgba(255,255,255,.95);border-radius:999px;padding:.45em 1em;
    font-weight:800;font-size:clamp(16px,2.6vmin,24px);display:flex;align-items:center;gap:.4em;
    box-shadow:0 4px 0 rgba(0,0,0,.12);
  }
  .iconbtn{
    background:rgba(255,255,255,.95);border-radius:50%;
    width:clamp(46px,7vmin,64px);height:clamp(46px,7vmin,64px);
    font-size:clamp(22px,3.6vmin,32px);display:grid;place-items:center;
    box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .1s;
  }
  .iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}

  /* ---------- home ---------- */
  .title{
    text-align:center;color:#fff;margin:clamp(4px,1.5vmin,16px) 0 0;
    font-size:clamp(40px,9vmin,84px);font-weight:900;letter-spacing:.5px;
    text-shadow:0 5px 0 rgba(0,0,0,.18);
  }
  .title span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
  .subtitle{text-align:center;color:#fff;opacity:.95;font-size:clamp(17px,2.8vmin,26px);font-weight:700;margin:0}

  .section-label{color:#fff;font-weight:900;font-size:clamp(18px,3vmin,28px);margin:.3em 0 -.2em .2em}

  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
  .level{
    background:rgba(255,255,255,.25);color:#fff;border-radius:var(--radius);
    padding:clamp(10px,2vmin,18px) 6px;font-weight:900;font-size:clamp(16px,2.8vmin,26px);
    display:flex;flex-direction:column;align-items:center;gap:2px;
    border:4px solid transparent;transition:transform .1s;
  }
  .level .emoji{font-size:clamp(28px,5vmin,46px)}
  .level small{font-weight:700;opacity:.9;font-size:.7em}
  .level.selected{background:#fff;color:var(--ink);border-color:var(--yellow);box-shadow:0 5px 0 rgba(0,0,0,.15)}
  .level:active{transform:scale(.96)}

  .modes{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
  @media (min-width:700px){ .modes{grid-template-columns:repeat(3,1fr)} }
  .mode{
    border-radius:var(--radius);padding:clamp(14px,3vmin,28px) 10px;
    color:#fff;font-weight:900;font-size:clamp(18px,3.2vmin,30px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25em;
    box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .1s, box-shadow .1s;
    min-height:clamp(110px,19vmin,190px);text-shadow:0 2px 0 rgba(0,0,0,.15);
  }
  .mode .big{font-size:clamp(38px,7.5vmin,70px);line-height:1}
  .mode:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .m-add{background:linear-gradient(160deg,#36d17f,#1fa463)}
  .m-sub{background:linear-gradient(160deg,#4fb3ff,#2a7fe0)}
  .m-mix{background:linear-gradient(160deg,#ffb238,#ff8a00)}
  .m-mul{background:linear-gradient(160deg,#ff7ac0,#e24a98)}
  .m-miss{background:linear-gradient(160deg,#2fd6c3,#13a596)}
  .m-cmp{background:linear-gradient(160deg,#ff7a7a,#e54848)}

  .home-footer{display:flex;justify-content:center;gap:var(--gap);margin-top:auto;padding-top:6px;flex-wrap:wrap}
  .wide-btn.installed{background:#d9f7e8;color:#16804d;box-shadow:none;cursor:default}
  .wide-btn.installed:active{transform:none}
  .sheet{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translate(-50%,140%);
    width:min(560px,calc(100% - 24px));background:#fff;border-radius:calc(var(--radius)*1.2);z-index:65;
    box-shadow:0 12px 40px rgba(20,10,60,.35);padding:clamp(16px,3vmin,26px);
    display:flex;gap:clamp(12px,2.4vmin,20px);align-items:center;transition:transform .45s cubic-bezier(.2,1.3,.4,1);visibility:hidden}
  .sheet.show{transform:translate(-50%,0);visibility:visible}
  .sheet img{width:clamp(56px,10vmin,84px);height:clamp(56px,10vmin,84px);border-radius:22%;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .sheet .txt{flex:1;min-width:0;padding-right:18px}
  .sheet b{display:block;font-size:clamp(18px,3vmin,26px);font-weight:900}
  .sheet p{margin:.15em 0 .6em;font-size:clamp(14px,2.3vmin,19px);font-weight:700;color:#6b6394}
  .sheet .row{display:flex;gap:10px;flex-wrap:wrap}
  .sheet .yes{background:var(--green);color:#fff;border-radius:999px;padding:.5em 1.1em;font-weight:900;font-size:clamp(16px,2.6vmin,22px);box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .sheet .no{background:#f1edff;color:#6b6394;border-radius:999px;padding:.5em 1em;font-weight:800;font-size:clamp(15px,2.4vmin,20px)}
  .sheet .x{position:absolute;top:6px;right:8px;background:none;font-size:20px;color:#b8afe6;padding:6px;line-height:1}
  .modal{position:fixed;inset:0;background:rgba(30,20,70,.55);display:none;align-items:center;justify-content:center;z-index:70;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
  .modal.open{display:flex;animation:pop .25s ease}
  .modal-card{background:#fff;border-radius:calc(var(--radius)*1.2);padding:clamp(20px,4vmin,36px);max-width:480px;width:100%;
    box-shadow:0 10px 0 rgba(0,0,0,.15);text-align:center}
  .modal-card h3{margin:0 0 .4em;font-size:clamp(24px,4.5vmin,36px);font-weight:900}
  .modal-card ol{text-align:left;margin:0 0 1em;padding-left:1.3em;font-size:clamp(17px,2.8vmin,24px);font-weight:700;line-height:1.5;color:#4a4270}
  .modal-card .share{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:.35em;background:#eef3ff;vertical-align:middle}
  .modal-card .hint{font-size:clamp(14px,2.3vmin,18px);color:#8a83ad;font-weight:700;margin:0 0 1em}
  .wide-btn{
    background:#fff;border-radius:999px;padding:.6em 1.3em;font-weight:900;
    font-size:clamp(17px,2.8vmin,26px);box-shadow:0 5px 0 rgba(0,0,0,.15);
  }
  .wide-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.15)}

  /* ---------- play ---------- */
  .progress{display:flex;gap:clamp(4px,1vmin,10px);justify-content:center;flex:1}
  .dot{
    width:clamp(14px,2.6vmin,24px);height:clamp(14px,2.6vmin,24px);border-radius:50%;
    background:rgba(255,255,255,.35);transition:all .25s;
  }
  .dot.now{background:#fff;transform:scale(1.25)}
  .dot.good{background:var(--yellow)}
  .dot.ok{background:#ffffffcc}

  .play-body{flex:1;display:flex;flex-direction:column;gap:var(--gap)}
  @media (orientation:landscape) and (min-width:900px){
    .play-body{flex-direction:row;align-items:stretch}
    .play-body > .qcard{flex:1.15}
    .play-body > .answers{flex:1;align-content:stretch;grid-auto-rows:1fr}
    .play-body .question{font-size:clamp(52px,8.5vmin,100px);flex-wrap:nowrap}
  }
  @media (orientation:portrait){
    .play-body > .qcard{flex:1}
    .ans{min-height:clamp(84px,13vh,200px)}
  }
  .qcard{
    background:var(--card);border-radius:calc(var(--radius) * 1.3);
    padding:clamp(16px,3.5vmin,36px);box-shadow:0 8px 0 rgba(0,0,0,.15);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vmin,18px);
    position:relative;min-height:clamp(200px,34vh,460px);
  }
  .prompt{font-weight:800;font-size:clamp(18px,3.2vmin,30px);color:#6b6394;text-align:center}
  .question{
    font-weight:900;font-size:clamp(52px,12vmin,120px);line-height:1.05;text-align:center;
    display:flex;align-items:center;gap:.25em;flex-wrap:wrap;justify-content:center;
  }
  .question .blank{
    display:inline-grid;place-items:center;min-width:1.3em;height:1.15em;border-radius:.2em;
    border:.07em dashed #b8afe6;color:#b8afe6;padding:0 .1em;
  }
  .visual{display:flex;gap:clamp(10px,3vmin,30px);align-items:center;justify-content:center;flex-wrap:wrap;
    font-size:clamp(22px,4.2vmin,40px);min-height:1.2em}
  .group{display:flex;flex-wrap:wrap;max-width:6.2em;gap:2px;justify-content:center;line-height:1.1}
  .group .gone{opacity:.25;filter:grayscale(1);position:relative}
  .visual .op{font-weight:900;color:#b8afe6}
  .speak{position:absolute;top:clamp(8px,1.6vmin,16px);right:clamp(8px,1.6vmin,16px);
    background:#f1edff;box-shadow:none}

  .answers{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
  .answers.two{grid-template-columns:repeat(2,1fr)}
  .ans{
    background:#fff;border-radius:var(--radius);
    font-weight:900;font-size:clamp(40px,8.5vmin,84px);
    min-height:clamp(84px,14vmin,150px);
    box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .1s, background .2s, box-shadow .1s;
  }
  .ans:nth-child(1){color:#1fa463}.ans:nth-child(2){color:#2a7fe0}.ans:nth-child(3){color:#ff8a00}.ans:nth-child(4){color:#e24a98}
  .ans:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .ans.right{background:var(--green);color:#fff !important;animation:jump .5s}
  .ans.wrong{background:#ffd9dd;color:#e0a3aa !important;animation:shake .4s;pointer-events:none}
  .answers.locked .ans{pointer-events:none}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @keyframes jump{40%{transform:scale(1.08) translateY(-6px)}}

  .feedback{
    text-align:center;color:#fff;font-weight:900;font-size:clamp(22px,4vmin,38px);min-height:1.4em;
    text-shadow:0 3px 0 rgba(0,0,0,.18);
  }

  /* ---------- results ---------- */
  .result-card{
    background:#fff;border-radius:calc(var(--radius)*1.4);box-shadow:0 8px 0 rgba(0,0,0,.15);
    padding:clamp(20px,5vmin,48px);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vmin,18px);
    text-align:center;margin:auto 0;
  }
  .result-card h2{margin:0;font-size:clamp(32px,7vmin,64px);font-weight:900}
  .stars{font-size:clamp(54px,12vmin,110px);letter-spacing:.1em}
  .stars span{display:inline-block;animation:starIn .5s both}
  .stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
  .stars .off{filter:grayscale(1);opacity:.25}
  @keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
  .result-card p{margin:0;font-size:clamp(18px,3.2vmin,30px);font-weight:800;color:#6b6394}
  .newsticker{font-size:clamp(18px,3vmin,28px);font-weight:900;background:#fff6d6;border-radius:var(--radius);padding:.5em 1em}
  .newsticker .big{font-size:2.2em;display:block;animation:jump 1s infinite}
  .btn-row{display:flex;gap:var(--gap);flex-wrap:wrap;justify-content:center}
  .btn{
    border-radius:999px;padding:.6em 1.4em;font-weight:900;font-size:clamp(20px,3.4vmin,32px);
    color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18);
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .btn.go{background:var(--green)} .btn.home{background:var(--blue)}

  /* ---------- stickers ---------- */
  .sticker-head{color:#fff;text-align:center;margin:0;font-size:clamp(28px,6vmin,54px);font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.15)}
  .sticker-info{color:#fff;text-align:center;font-weight:800;font-size:clamp(16px,2.8vmin,24px);margin:0}
  .sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
  @media (min-width:700px){.sticker-grid{grid-template-columns:repeat(6,1fr)}}
  .sticker{
    aspect-ratio:1;background:#fff;border-radius:var(--radius);display:grid;place-items:center;
    font-size:clamp(34px,7vmin,64px);box-shadow:0 5px 0 rgba(0,0,0,.14);
  }
  .sticker.locked{background:rgba(255,255,255,.25);box-shadow:none;font-size:clamp(22px,4vmin,36px);color:#fff;font-weight:900}

  /* confetti */
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);
    background:#fff;border-radius:999px;padding:.6em 1.2em;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.2);
    display:none;z-index:60;font-size:clamp(15px,2.4vmin,20px);text-align:center
  }
  .toast button{background:var(--green);color:#fff;border-radius:999px;padding:.35em .9em;margin-left:.5em;font-weight:900}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <section class="screen active" id="home">
    <div class="topbar">
      <div class="pill" aria-label="Total stars">⭐ <span id="totalStars">0</span></div>
      <button class="iconbtn" id="soundBtn" aria-label="Sound on or off">🔊</button>
    </div>
    <h1 class="title"><span>🦉</span> Math Quest</h1>
    <p class="subtitle">Pick a level, then pick a game!</p>

    <div class="section-label">Level</div>
    <div class="levels" id="levels">
      <button class="level" data-level="1"><span class="emoji">🐣</span>Easy<small>up to 10</small></button>
      <button class="level" data-level="2"><span class="emoji">🐥</span>Medium<small>up to 20</small></button>
      <button class="level" data-level="3"><span class="emoji">🦅</span>Hard<small>up to 100</small></button>
    </div>

    <div class="section-label">Games</div>
    <div class="modes">
      <button class="mode m-add" data-mode="add"><span class="big">➕</span>Adding</button>
      <button class="mode m-sub" data-mode="sub"><span class="big">➖</span>Taking Away</button>
      <button class="mode m-mix" data-mode="mix"><span class="big">🔀</span>Mix It Up</button>
      <button class="mode m-miss" data-mode="miss"><span class="big">❓</span>Missing Number</button>
      <button class="mode m-cmp" data-mode="cmp"><span class="big">🐊</span>Bigger or Smaller</button>
      <button class="mode m-mul" data-mode="mul"><span class="big">✖️</span>Times Tables</button>
    </div>

    <div class="home-footer">
      <button class="wide-btn" id="stickersBtn">📒 My Stickers</button>
      <button class="wide-btn" id="installBtn">📲 Add to Home</button>
    </div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="play">
    <div class="topbar">
      <button class="iconbtn" id="quitBtn" aria-label="Go home">🏠</button>
      <div class="progress" id="progress"></div>
      <div class="pill">⭐ <span id="roundStars">0</span></div>
    </div>
    <div class="play-body">
      <div class="qcard">
        <button class="iconbtn speak" id="speakBtn" aria-label="Read it to me">🗣️</button>
        <div class="prompt" id="prompt"></div>
        <div class="question" id="question"></div>
        <div class="visual" id="visual"></div>
      </div>
      <div class="answers" id="answers"></div>
    </div>
    <div class="feedback" id="feedback"></div>
  </section>

  <!-- RESULTS -->
  <section class="screen" id="results">
    <div class="result-card">
      <h2 id="resTitle">Great job!</h2>
      <div class="stars" id="resStars"></div>
      <p id="resText"></p>
      <div id="resSticker"></div>
      <div class="btn-row">
        <button class="btn go" id="againBtn">▶ Play again</button>
        <button class="btn home" id="homeBtn">🏠 Home</button>
      </div>
    </div>
  </section>

  <!-- STICKERS -->
  <section class="screen" id="stickers">
    <div class="topbar">
      <button class="iconbtn" id="stickBack" aria-label="Go home">🏠</button>
      <div class="pill">⭐ <span id="stickStars">0</span></div>
    </div>
    <h2 class="sticker-head">📒 My Stickers</h2>
    <p class="sticker-info" id="stickInfo"></p>
    <div class="sticker-grid" id="stickerGrid"></div>
  </section>
</div>

<div class="confetti" id="confetti"></div>
<div class="toast" id="toast"></div>

<div class="sheet" id="installSheet" role="dialog" aria-labelledby="sheetTitle">
  <button class="x" id="sheetX" aria-label="Close">✕</button>
  <img src="icons/icon-192.png" alt="">
  <div class="txt">
    <b id="sheetTitle">Play it like an app! 🦉</b>
    <p>Add it to your home screen for full screen play. It works without internet too!</p>
    <div class="row">
      <button class="yes" id="sheetYes">📲 Add to Home</button>
      <button class="no" id="sheetNo">Not now</button>
    </div>
  </div>
</div>

<div class="modal" id="installModal" role="dialog" aria-modal="true" aria-labelledby="installTitle">
  <div class="modal-card">
    <h3 id="installTitle">📲 Add to Home Screen</h3>
    <ol id="installSteps"></ol>
    <p class="hint" id="installHint"></p>
    <button class="btn go" id="installClose">Got it!</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const ROUND = 10;
  const STARS_PER_STICKER = 15;
  const STICKERS = ['🐶','🐱','🐼','🦊','🐸','🐵','🦁','🐯','🐨','🐷','🐰','🐻','🦄','🐙','🐢','🦋','🐬','🦖','🐧','🦉','🐳','🦒','🐞','🐲'];
  const OBJECTS = ['🍎','⭐','🐟','🍓','🌸','⚽','🧁','🐥','🍪','🎈'];
  const PRAISE = ['Great job!','Awesome!','You got it!','Super!','Wow!','Yes!','Brilliant!','High five! ✋','Amazing!','Math star!'];
  const TRY = ['Try again!','So close!','Have another go!','Almost!'];

  // ---------- storage (safe) ----------
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('mq_'+k); return v===null ? d : JSON.parse(v);}catch(e){return d;} },
    set(k, v){ try{ localStorage.setItem('mq_'+k, JSON.stringify(v)); }catch(e){} }
  };
  const state = {
    level: store.get('level', 1),
    sound: store.get('sound', true),
    stars: store.get('stars', 0),
    mode: 'add', q: null, idx: 0, roundStars: 0, firstTry: true, results: []
  };

  // ---------- sound ----------
  let ctx;
  function tone(freq, start, dur, type='sine', vol=.18){
    if(!state.sound) return;
    try{
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if(ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      const t = ctx.currentTime + start;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + .05);
    }catch(e){}
  }
  const sfx = {
    tap(){ tone(660,0,.08,'triangle',.1); },
    right(){ [523,659,784].forEach((f,i)=>tone(f,i*.09,.25,'triangle')); },
    wrong(){ tone(240,0,.18,'sawtooth',.08); tone(200,.12,.22,'sawtooth',.08); },
    win(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.12,.3,'triangle')); }
  };
  function say(text){
    if(!state.sound || !('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = .9; u.pitch = 1.1;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  // ---------- helpers ----------
  const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const shuffle = arr => { for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; };
  const MAX = {1:10, 2:20, 3:100};

  function options(answer, max){
    const set = new Set([answer]);
    const near = [1,-1,2,-2,10,-10,3,-3];
    let guard = 0;
    while(set.size < 4 && guard++ < 60){
      const d = guard < 20 ? pick(near) : rnd(-5,5);
      const v = answer + d;
      if(v >= 0 && v <= Math.max(max, answer + (max >= 100 ? 10 : 3))) set.add(v);
    }
    let fill = 0; while(set.size < 4) set.add(answer + (++fill) + 3);
    return shuffle([...set]);
  }

  // ---------- question makers ----------
  function makeAdd(L){
    const max = MAX[L];
    let a, b;
    if(L===3){ a = rnd(10,89); b = rnd(1, Math.min(9 + (Math.random()<.4?40:0), max - a)); if(a+b>max) b = max-a; }
    else if(L===1){ a = rnd(1, max-1); b = rnd(1, max - a); }
    else { a = rnd(0, max); b = rnd(0, max - a); if(L===2 && a+b<8){ a = rnd(5,12); b = rnd(3, max-a);} }
    return { text:[a,'+',b,'=','?'], answer:a+b, opts:options(a+b,max), speak:`What is ${a} plus ${b}?`,
             prompt:'Add them up!', visual: L===1 ? {type:'add', a, b} : null };
  }
  function makeSub(L){
    const max = MAX[L];
    let a = rnd(L===1?1:(L===2?8:20), max), b = rnd(0, L===3 ? Math.min(a, 30) : a);
    return { text:[a,'−',b,'=','?'], answer:a-b, opts:options(a-b,max), speak:`What is ${a} take away ${b}?`,
             prompt:'Take away!', visual: L===1 ? {type:'sub', a, b} : null };
  }
  function makeMiss(L){
    const max = MAX[L];
    const add = Math.random() < .6;
    if(add){
      const c = rnd(L===1?2:5, max), a = rnd(0,c), b = c - a;
      return { text:[a,'+','□','=',c], answer:b, opts:options(b,max), speak:`${a} plus what makes ${c}?`, prompt:'What number is missing?' };
    } else {
      const a = rnd(L===1?2:5, max), b = rnd(0,a), c = a - b;
      return { text:[a,'−','□','=',c], answer:b, opts:options(b,max), speak:`${a} take away what makes ${c}?`, prompt:'What number is missing?' };
    }
  }
  function makeCmp(L){
    const max = MAX[L];
    let a = rnd(0,max), b = rnd(0,max);
    while(a===b) b = rnd(0,max);
    const bigger = Math.random() < .6;
    const ans = bigger ? Math.max(a,b) : Math.min(a,b);
    return { text:[], answer:ans, opts:[a,b], two:true,
             speak: bigger ? `Which number is bigger, ${a} or ${b}?` : `Which number is smaller, ${a} or ${b}?`,
             prompt: bigger ? '🐊 Which number is BIGGER?' : '🐭 Which number is SMALLER?',
             visual: L===1 ? {type:'cmp', a, b} : null };
  }
  function makeMul(L){
    const tables = L===1 ? [1,2,10] : L===2 ? [2,5,10] : [2,3,4,5,10];
    const t = pick(tables), n = rnd(L===1?1:0, L===1?5:10);
    const [a,b] = Math.random()<.5 ? [t,n] : [n,t];
    const visual = (L===1 && a*b <= 20 && a<=5 && b<=5) ? {type:'mul', a, b} : null;
    return { text:[a,'×',b,'=','?'], answer:a*b, opts:options(a*b, 100), speak:`What is ${a} times ${b}?`,
             prompt: L===1 ? 'Groups of things!' : 'Times tables!', visual };
  }
  function makeQ(){
    const L = state.level;
    switch(state.mode){
      case 'add': return makeAdd(L);
      case 'sub': return makeSub(L);
      case 'mix': return Math.random()<.5 ? makeAdd(L) : makeSub(L);
      case 'miss': return makeMiss(L);
      case 'cmp': return makeCmp(L);
      case 'mul': return makeMul(L);
    }
  }

  // ---------- rendering ----------
  function show(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id===id));
    window.scrollTo(0,0);
  }
  function renderHome(){
    $('totalStars').textContent = state.stars;
    document.querySelectorAll('.level').forEach(b => b.classList.toggle('selected', +b.dataset.level === state.level));
    $('soundBtn').textContent = state.sound ? '🔊' : '🔇';
  }
  function renderProgress(){
    const p = $('progress'); p.innerHTML = '';
    for(let i=0;i<ROUND;i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i===state.idx ? ' now' : '') + (state.results[i]===true ? ' good' : state.results[i]===false ? ' ok' : '');
      p.appendChild(d);
    }
    $('roundStars').textContent = state.roundStars;
  }
  function objs(n, emoji, goneFrom){
    let s = '';
    for(let i=0;i<n;i++) s += `<span class="${goneFrom!=null && i>=goneFrom ? 'gone':''}">${emoji}</span>`;
    return `<div class="group">${s}</div>`;
  }
  function renderVisual(v){
    const el = $('visual');
    if(!v){ el.innerHTML=''; return; }
    const e = pick(OBJECTS);
    if(v.type==='add') el.innerHTML = objs(v.a,e) + `<span class="op">+</span>` + objs(v.b,e);
    else if(v.type==='sub') el.innerHTML = objs(v.a,e,v.a-v.b);
    else if(v.type==='cmp') el.innerHTML = objs(v.a,e) + `<span class="op">or</span>` + objs(v.b,e);
    else if(v.type==='mul'){
      let s=''; for(let i=0;i<v.a;i++) s += objs(v.b,e);
      el.innerHTML = s;
    }
  }
  function nextQuestion(){
    const q = state.q = makeQ();
    state.firstTry = true;
    $('prompt').textContent = q.prompt;
    $('question').innerHTML = q.text.map(t => t==='?'||t==='□' ? `<span class="blank">?</span>` : `<span>${t}</span>`).join('');
    renderVisual(q.visual);
    const box = $('answers'); box.innerHTML = ''; box.className = 'answers' + (q.two ? ' two' : '');
    q.opts.forEach(v => {
      const b = document.createElement('button');
      b.className = 'ans'; b.textContent = v;
      b.addEventListener('click', () => answer(b, v));
      box.appendChild(b);
    });
    $('feedback').textContent = '';
    renderProgress();
  }
  function answer(btn, v){
    const q = state.q;
    if(v === q.answer){
      sfx.right();
      btn.classList.add('right');
      $('answers').classList.add('locked');
      if(state.firstTry){ state.roundStars++; }
      state.results[state.idx] = state.firstTry;
      // fill in blank
      const blank = document.querySelector('#question .blank');
      if(blank){ blank.textContent = q.answer; blank.style.color = '#1fa463'; blank.style.borderColor = 'transparent'; }
      $('feedback').textContent = (state.firstTry ? '⭐ ' : '👍 ') + pick(PRAISE);
      if(state.firstTry) burst(18);
      renderProgress();
      setTimeout(() => {
        state.idx++;
        if(state.idx >= ROUND) finish(); else nextQuestion();
      }, 1100);
    } else {
      sfx.wrong();
      state.firstTry = false;
      btn.classList.add('wrong');
      $('feedback').textContent = pick(TRY) + ' 💪';
    }
  }
  function startRound(mode){
    state.mode = mode || state.mode;
    state.idx = 0; state.roundStars = 0; state.results = [];
    show('play'); nextQuestion();
  }
  function finish(){
    const before = Math.floor(state.stars / STARS_PER_STICKER);
    state.stars += state.roundStars; store.set('stars', state.stars);
    const after = Math.floor(state.stars / STARS_PER_STICKER);
    const s = state.roundStars;
    const n = s >= 9 ? 3 : s >= 6 ? 2 : s >= 1 ? 1 : 0;
    $('resTitle').textContent = n===3 ? 'Superstar! 🎉' : n===2 ? 'Great job! 🎉' : n===1 ? 'Good work! 👍' : 'Keep practicing! 💪';
    $('resStars').innerHTML = [0,1,2].map(i => `<span class="${i<n?'':'off'}">⭐</span>`).join('');
    $('resText').textContent = `You got ${s} out of ${ROUND} right on the first try!`;
    let stickerHtml = '';
    if(after > before && before < STICKERS.length){
      const st = STICKERS[Math.min(after, STICKERS.length) - 1];
      stickerHtml = `<div class="newsticker"><span class="big">${st}</span>New sticker unlocked!</div>`;
    } else if(after < STICKERS.length){
      const need = STARS_PER_STICKER - (state.stars % STARS_PER_STICKER);
      stickerHtml = `<p>${need} more ⭐ for your next sticker!</p>`;
    }
    $('resSticker').innerHTML = stickerHtml;
    show('results');
    sfx.win(); if(n>=2) burst(70);
    say($('resTitle').textContent.replace(/[^\w\s!]/g,'') + ` You got ${s} out of ${ROUND}.`);
  }
  function renderStickers(){
    const unlocked = Math.min(Math.floor(state.stars / STARS_PER_STICKER), STICKERS.length);
    $('stickStars').textContent = state.stars;
    $('stickInfo').textContent = unlocked >= STICKERS.length ? 'You found them all! 🏆' :
      `${unlocked} of ${STICKERS.length} found · ${STARS_PER_STICKER - state.stars % STARS_PER_STICKER} ⭐ to the next one`;
    $('stickerGrid').innerHTML = STICKERS.map((s,i) =>
      i < unlocked ? `<div class="sticker">${s}</div>` : `<div class="sticker locked">?</div>`).join('');
    show('stickers');
  }

  // ---------- confetti ----------
  function burst(n){
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const box = $('confetti');
    const colors = ['#ffd23f','#2ec27e','#3fa7ff','#ff6fb5','#ff9f1c','#ffffff'];
    for(let i=0;i<n;i++){
      const c = document.createElement('i');
      c.style.left = Math.random()*100 + 'vw';
      c.style.background = pick(colors);
      c.style.animationDuration = (1.2 + Math.random()*1.4) + 's';
      c.style.animationDelay = (Math.random()*.3) + 's';
      box.appendChild(c);
      setTimeout(() => c.remove(), 3000);
    }
  }

  // ---------- events ----------
  document.querySelectorAll('.level').forEach(b => b.addEventListener('click', () => {
    sfx.tap(); state.level = +b.dataset.level; store.set('level', state.level); renderHome();
  }));
  document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => { sfx.tap(); startRound(b.dataset.mode); }));
  $('soundBtn').addEventListener('click', () => { state.sound = !state.sound; store.set('sound', state.sound); renderHome(); sfx.tap(); });
  $('speakBtn').addEventListener('click', () => state.q && say(state.q.speak));
  $('quitBtn').addEventListener('click', () => { sfx.tap(); renderHome(); show('home'); });
  $('againBtn').addEventListener('click', () => { sfx.tap(); startRound(); });
  $('homeBtn').addEventListener('click', () => { sfx.tap(); renderHome(); show('home'); });
  $('stickersBtn').addEventListener('click', () => { sfx.tap(); renderStickers(); });
  $('stickBack').addEventListener('click', () => { sfx.tap(); renderHome(); show('home'); });
  document.addEventListener('gesturestart', e => e.preventDefault()); // stop pinch-zoom on iOS

  renderHome();


  // ---------- Add to Home Screen ----------
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const isSafari = /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA|FBAN|FBAV|Instagram/i.test(ua);
  let deferredPrompt = null;
  let installed = false;

  function isStandalone(){
    return (window.matchMedia && (matchMedia('(display-mode: standalone)').matches ||
            matchMedia('(display-mode: fullscreen)').matches)) || navigator.standalone === true;
  }
  function renderInstall(){
    const b = $('installBtn');
    if(installed){
      b.textContent = '✅ Installed';
      b.classList.add('installed');
    } else {
      b.textContent = '📲 Add to Home';
      b.classList.remove('installed');
    }
  }
  function markInstalled(){ installed = true; store.set('installed', true); renderInstall(); const sh=$('installSheet'); sh && sh.classList.remove('show'); }

  function openInstallHelp(already){
    let steps, hint = '';
    $('installTitle').textContent = already ? '✅ Already installed!' : '📲 Add to Home Screen';
    if(isIOS && isSafari){
      const ipad = /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      steps = [
        `Tap the Share button <span class="share">⬆️</span> ${ipad ? 'at the top of the screen' : 'at the bottom of the screen'}.`,
        'Scroll down and tap <b>Add to Home Screen</b>.',
        'Tap <b>Add</b>. Math Quest will be on your home screen! 🦉'
      ];
    } else if(isIOS){
      steps = [
        'Open this page in <b>Safari</b> (copy the link and paste it in Safari).',
        'Tap the Share button <span class="share">⬆️</span>.',
        'Tap <b>Add to Home Screen</b>, then <b>Add</b>.'
      ];
      hint = 'On iPhone and iPad, apps can only be added from Safari.';
    } else if(isAndroid){
      steps = [
        'Tap the menu <b>⋮</b> at the top right of Chrome.',
        'Tap <b>Install app</b> or <b>Add to Home screen</b>.',
        'Tap <b>Install</b>. 🦉'
      ];
    } else {
      steps = [
        'Look for the install icon <b>⊕</b> in the address bar, or open the browser menu.',
        'Choose <b>Install Math Quest</b>.'
      ];
    }
    $('installSteps').innerHTML = steps.map(x => `<li>${x}</li>`).join('');
    if(already){
      steps = ['Look for the 🦉 <b>Math Quest</b> icon on your home screen and tap it.'];
      hint = 'Deleted it? Close this and the button will help you add it again.';
      installed = false; store.set('installed', false); renderInstall();
    }
    $('installHint').textContent = hint;
    $('installHint').style.display = hint ? '' : 'none';
    $('installModal').classList.add('open');
  }

  async function startInstall(){
    if(isStandalone()) return;            // already running as the installed app
    sfx.tap();
    if(installed && !deferredPrompt){     // installed earlier on this device
      openInstallHelp(true); return;
    }
    if(deferredPrompt){
      deferredPrompt.prompt();
      try{
        const choice = await deferredPrompt.userChoice;
        if(choice && choice.outcome === 'accepted') markInstalled();
      }catch(e){}
      deferredPrompt = null;
    } else {
      openInstallHelp();
    }
  }
  $('installBtn').addEventListener('click', startInstall);

  // ---------- install pop-up ----------
  const SNOOZE_DAYS = 3;
  function hideSheet(){ $('installSheet').classList.remove('show'); }
  function maybeShowSheet(){
    if(installed || isStandalone()) return;
    if(Date.now() < store.get('sheetSnooze', 0)) return;
    if(!$('home').classList.contains('active')) return;   // only on the home screen, never mid-game
    $('installSheet').classList.add('show');
  }
  $('sheetYes').addEventListener('click', () => { hideSheet(); startInstall(); });
  const snooze = () => { hideSheet(); store.set('sheetSnooze', Date.now() + SNOOZE_DAYS*864e5); };
  $('sheetNo').addEventListener('click', snooze);
  $('sheetX').addEventListener('click', snooze);
  window.addEventListener('appinstalled', hideSheet);
  // Hide it as soon as a game starts
  document.querySelectorAll('.mode, #stickersBtn').forEach(b => b.addEventListener('click', hideSheet));
  $('installClose').addEventListener('click', () => $('installModal').classList.remove('open'));
  $('installModal').addEventListener('click', e => { if(e.target.id === 'installModal') $('installModal').classList.remove('open'); });

  window.addEventListener('beforeinstallprompt', e => {
    // Browser says the app is NOT installed yet and can be installed with one tap.
    e.preventDefault();
    deferredPrompt = e;
    installed = false; store.set('installed', false);
    renderInstall();
  });
  window.addEventListener('appinstalled', markInstalled);

  async function checkInstalled(){
    if(isStandalone()){ markInstalled(); return; }   // opened from the home screen icon
    // Chrome/Edge on Android & desktop can tell us if this web app is installed.
    if('getInstalledRelatedApps' in navigator){
      try{
        const apps = await navigator.getInstalledRelatedApps();
        if(apps && apps.length){ markInstalled(); return; }
      }catch(e){}
    }
    // Remembered from an earlier install on this device (cleared again if the browser offers to install).
    if(store.get('installed', false)) { installed = true; }
    renderInstall();
  }
  checkInstalled().then(() => setTimeout(maybeShowSheet, 2000));

  // ---------- PWA ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          nw && nw.addEventListener('statechange', () => {
            if(nw.state === 'installed' && navigator.serviceWorker.controller){
              const t = $('toast');
              t.innerHTML = 'New version ready! <button id="reloadBtn">Update</button>';
              t.style.display = 'block';
              $('reloadBtn').onclick = () => location.reload();
            }
          });
        });
      }).catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
